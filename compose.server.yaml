name: tramflow
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      TRAMFLOW_MONITOR_ENABLED: "${TRAMFLOW_MONITOR_ENABLED:-1}"
      TRAMFLOW_MONITOR_DIR: /var/lib/tramflow-monitoring
      TRAMFLOW_WEATHER_PROVIDER: met
    volumes:
      - monitoring-data:/var/lib/tramflow-monitoring
    ports:
      - "127.0.0.1:8000:8000"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
volumes:
  monitoring-data:
