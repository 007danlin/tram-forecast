name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and ML tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check source delivery
        run: python3 -m scripts.check_delivery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ml/requirements.txt
      - run: python -m pip install -r backend/requirements.txt -r ml/requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s backend/tests -v
      - run: python -m backend.contracts.openapi --check
      - run: python -m unittest discover -s tests/integration -v
      - run: python -m unittest discover -s tests/ml -v
      - run: python -m unittest discover -s tests/tooling -v

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend

  compose:
    name: Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: tramflow-ci
      TRAMFLOW_HANDOFF_HOST_DIR: /tmp/tramflow-ci-release
    steps:
      - uses: actions/checkout@v4
      - name: Validate local and server deployment configuration
        run: |
          bash -n deploy/update.sh deploy/handoff.sh deploy/sync-source.sh
          docker compose config --quiet
          docker compose -f compose.server.yaml config --quiet
          TRAMFLOW_HANDOFF_HOST_DIR=/tmp/synthetic-handoff docker compose -f compose.server.yaml -f compose.handoff.yaml config --quiet
      - name: Build and start containers
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Check frontend and API through its proxy
        run: |
          curl --fail --silent --show-error --max-time 10 --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:5173/ -o /tmp/frontend.html
          python3 -m scripts.check_integration --base-url http://127.0.0.1:5173
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check container handoff with an explicitly synthetic package
        run: |
          python -m pip install -r backend/requirements.txt
          python - <<'PY'
          import os, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'tests/tooling')
          from test_package_ml_handoff import make_package_inputs
          from scripts.package_ml_handoff import package
          from backend.handoff.install import install
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              model, forecast = make_package_inputs(root)
              package(model, forecast, root / 'fixture.zip')
              install(root / 'fixture.zip', Path(os.environ['TRAMFLOW_HANDOFF_HOST_DIR']))
          PY
          docker compose -f compose.yaml -f compose.handoff.yaml up -d --wait --wait-timeout 120
          python -m backend.handoff.check --base-url http://127.0.0.1:5173 --release "$TRAMFLOW_HANDOFF_HOST_DIR"
          docker compose stop backend
          unset TRAMFLOW_HANDOFF_HOST_DIR
          source deploy/handoff.sh
          select_handoff
          test "$TRAMFLOW_HANDOFF_HOST_DIR" = /tmp/tramflow-ci-release
          docker compose -f compose.yaml -f compose.handoff.yaml up -d --wait --wait-timeout 120
          python -m backend.handoff.check --base-url http://127.0.0.1:5173 --release "$TRAMFLOW_HANDOFF_HOST_DIR"
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans
